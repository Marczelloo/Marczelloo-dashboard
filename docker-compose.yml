# ================================
# Marczelloo Dashboard - Docker Compose
# ================================
#
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose logs -f dashboard  # View logs
#   docker-compose down               # Stop all services
#
# Environment variables should be in .env file or passed via docker-compose

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marczelloo-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      # App port (changed from 3000 to avoid conflict with AtlasHub)
      - PORT=3100

      # AtlasHub Configuration
      - ATLASHUB_API_URL=${ATLASHUB_API_URL:-https://api-atlashub.marczelloo.dev}
      - ATLASHUB_SECRET_KEY=${ATLASHUB_SECRET_KEY}

      # Portainer Configuration (internal Docker network)
      - PORTAINER_URL=${PORTAINER_URL:-http://portainer:9000}
      - PORTAINER_TOKEN=${PORTAINER_TOKEN}
      - PORTAINER_USERNAME=${PORTAINER_USERNAME}
      - PORTAINER_PASSWORD=${PORTAINER_PASSWORD}

      # Deploy agent (separate marczelloo-agent stack on the same network)
      - AGENT_URL=${AGENT_URL:-http://mz-agent:8790}
      - AGENT_TOKEN=${AGENT_TOKEN}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_TUNNEL_ID=${CLOUDFLARE_TUNNEL_ID:-}
      - CLOUDFLARE_LEGACY_TUNNEL_IDS=${CLOUDFLARE_LEGACY_TUNNEL_IDS:-}
      # Shared network cloudflared reaches containers on; TUNNEL_ORIGIN=edge routes by container name
      - EDGE_NETWORK=${EDGE_NETWORK:-}
      - TUNNEL_ORIGIN=${TUNNEL_ORIGIN:-loopback}
      - EDGE_DROP_PORTS=${EDGE_DROP_PORTS:-false}

      # App Configuration
      - OWNER_EMAILS=${OWNER_EMAILS}
      # Cloudflare Access application: Zero Trust → Access → Applications → Overview
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD}
      - UPTIME_RETENTION_DAYS=${UPTIME_RETENTION_DAYS:-30}
      # PIN sessions: createPinSession() throws without SESSION_SECRET
      - SESSION_SECRET=${SESSION_SECRET}
      - PIN_SESSION_TTL=${PIN_SESSION_TTL:-1800}
      - DASHBOARD_GITHUB_URL=${DASHBOARD_GITHUB_URL}
      - PIN_HASH=${PIN_HASH}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - PORTAINER_TOKEN_FILE=/app/data/portainer-token.json
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3100}

      # Monitoring Configuration
      - CRON_SECRET=${CRON_SECRET}
      - MONITORING_INTERVAL_MS=${MONITORING_INTERVAL_MS:-60000}
      - MONITOR_INCIDENT_RETENTION_DAYS=${MONITOR_INCIDENT_RETENTION_DAYS:-90}

      # Discord Notifications (optional)
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}

      # GitHub App Integration
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_PRIVATE_KEY_BASE64=${GITHUB_PRIVATE_KEY_BASE64}
      - GITHUB_INSTALLATION_ID=${GITHUB_INSTALLATION_ID}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
    volumes:
      # Persistent encrypted fallback for dynamic secrets such as Portainer token
      - dashboard_data:/app/data
    depends_on:
      - portainer
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - marczelloo

  # ================================
  # Demo Dashboard (Public showcase with mock data)
  # ================================
  # Access via: demo.yourdomain.com (configure in Cloudflare Tunnel)
  # This instance uses mock data and has all destructive actions disabled.
  # Safe to expose publicly without Cloudflare Access protection.
  dashboard-demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marczelloo-dashboard-demo
    restart: unless-stopped
    ports:
      - "127.0.0.1:3101:3101"
    environment:
      - PORT=3101
      - DEMO_MODE=true
      # Demo mode uses mock data, no real backend needed
      - ATLASHUB_API_URL=http://localhost:3001
      - ATLASHUB_SECRET_KEY=demo_not_used
      - DEV_USER_EMAIL=demo@example.com
      - DEV_SKIP_PIN=true
      - NEXT_PUBLIC_APP_URL=${DEMO_APP_URL:-http://localhost:3101}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3101/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - marczelloo

  # Portainer - Docker management UI
  portainer:
    image: portainer/portainer-ce:latest
    container_name: marczelloo-portainer
    restart: unless-stopped
    ports:
      - "127.0.0.1:9201:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - marczelloo

volumes:
  dashboard_data:
  portainer_data:

networks:
  marczelloo:
    driver: bridge
